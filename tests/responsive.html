<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Math Lab responsive preview</title><style>body{font:14px Arial;background:#dfe7ef;margin:20px}iframe{height:950px;border:1px solid #7b8ca0;background:white;display:block}button{padding:10px;margin:0 6px 16px 0}</style></head><body><h1>Responsive review</h1><p>Use the app inside a frame with a phone or tablet viewport. This is a manual QA helper.</p><button id="phone">Phone · 390px</button><button id="tablet">Tablet · 768px</button><iframe id="preview" title="Math Lab responsive preview" src="../index.html" width="390"></iframe><script>for(const [id,width] of [['phone',390],['tablet',768]])document.getElementById(id).onclick=()=>document.getElementById('preview').width=width;</script></body></html>
